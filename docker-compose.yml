version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - ./apps/server/.env
    ports:
      - "3005:3005"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:3000"

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    env_file:
      - ./apps/ws/.env
    depends_on:
      - redis
    ports:
      - "5000:5000"

  redis:
    image: redis:7
    ports:
      - "6379:6379"